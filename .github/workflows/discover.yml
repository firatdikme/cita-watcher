name: Discover tramites

on:
  workflow_dispatch:
    inputs:
      province:
        description: "Province label as shown in the dropdown"
        required: false
        default: "Barcelona"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run discovery
        run: |
          python discover_tramites.py --province "${{ inputs.province }}" | tee discover-output.txt
          {
            echo "## Discovery output"
            echo
            echo '```'
            cat discover-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-${{ github.run_id }}
          path: |
            debug-discover/
            discover-output.txt
          if-no-files-found: ignore
          retention-days: 7
