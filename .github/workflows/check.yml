name: Cita check

on:
  schedule:
    # Every 12 minutes — GH Actions cron supports any */N expression
    - cron: "*/12 * * * *"
  workflow_dispatch: {}        # allow manual run from the Actions tab

concurrency:
  group: cita-check
  cancel-in-progress: false    # never overlap

permissions:
  contents: write              # needed so the job can commit runs.log

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # silence Node.js 20 deprecation warning
      CITA_DOC_TYPE:     ${{ vars.CITA_DOC_TYPE     || 'N.I.E.' }}
      CITA_PROVINCIA_ID: ${{ vars.CITA_PROVINCIA_ID || '205'    }}
      CITA_SEDE_ID:      ${{ vars.CITA_SEDE_ID      || '2'      }}
      CITA_TRAMITE_ID:   ${{ vars.CITA_TRAMITE_ID   || '4142'   }}
      CITA_DOC_NUMBER:   ${{ secrets.CITA_DOC_NUMBER }}
      CITA_FULL_NAME:    ${{ secrets.CITA_FULL_NAME  }}
      CITA_NTFY_TOPIC:   ${{ secrets.CITA_NTFY_TOPIC }}
      CITA_HEADLESS:     "1"
      CITA_JITTER_MAX_S: "60"
      PYTHONUNBUFFERED:  "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          OUT=$(python cita_watcher.py 2>&1 | tee /dev/stderr)
          # Result line is the one starting with "[YYYY-..." — Playwright errors are multi-line,
          # so grab the first such line, not just tail.
          LAST=$(printf '%s\n' "$OUT" | grep -m1 '^\[' || echo "[$(date -u +'%Y-%m-%d %H:%M:%S')] error:no-output-line")
          echo "line=$LAST" >> "$GITHUB_OUTPUT"
          # Render in the run's job-summary page
          {
            echo "## Cita check"
            echo
            echo '```'
            echo "$LAST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug artifacts on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Append to runs.log and push
        if: always()
        run: |
          set -e
          LINE='${{ steps.check.outputs.line }}'
          [ -z "$LINE" ] && LINE="[$(date -u +'%Y-%m-%d %H:%M:%S')] error:no-output"
          touch runs.log
          echo "$LINE" >> runs.log
          # keep file bounded — last 2000 lines (~16 days at 12-min cadence)
          tail -n 2000 runs.log > runs.log.tmp && mv runs.log.tmp runs.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add runs.log
          if ! git diff --cached --quiet; then
            git commit -m "log: ${LINE}" -m "[skip ci]"
            git push
          fi
